name: Daily run
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect, analyse, forecast
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python -m coin.run
      - name: Save results to the repo
        run: |
          git config user.name "coin-bot"
          git config user.email "coin-bot@users.noreply.github.com"
          git add -A data journal docs/data
          git commit -m "Daily run $(date -u +%F)" || echo "nothing to commit"
          git push
